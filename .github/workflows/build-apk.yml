name: Build Android Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Android project structure and Gradle wrapper
        run: |
          if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
            echo "Error: Android project root (settings.gradle / settings.gradle.kts) not found."
            exit 1
          fi

          if [ ! -f "gradlew" ]; then
            echo "Error: Gradle wrapper script 'gradlew' not found."
            exit 1
          fi

          if [ ! -d "app" ]; then
            echo "Error: Application module directory 'app' not found."
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Remove stale build caches
        run: |
          echo "Removing stale project-level Gradle and application build caches..."
          rm -rf .gradle
          rm -rf app/build

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Locate and verify generated APK
        id: locate_apk
        run: |
          APK_PATHS=$(find app/build/outputs/apk -type f -name "*.apk" 2>/dev/null)
          if [ -z "$APK_PATHS" ]; then
            echo "Error: No APK files found in app/build/outputs/apk!"
            exit 1
          fi
          echo "Found generated APK(s):"
          echo "$APK_PATHS"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-app-debug-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
